<!DOCTYPE html>
<html lang="en" class="bg-gray-950 text-white">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatterbox</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="min-h-screen flex flex-col bg-gray-950 text-white">
  <!-- LOADING SCREEN -->
  <div id="loading-screen" class="fixed inset-0 bg-gray-950 flex items-center justify-center z-[100]">
    <div class="text-center">
      <div class="text-7xl font-black tracking-widest text-purple-500 animate-pulse">CHATTERBOX</div>
      <div class="mt-6 text-gray-400">POWERING UP...</div>
    </div>
  </div>

  <!-- Top Nav -->
  <div class="h-14 bg-black border-b border-purple-500 flex items-center px-4 gap-4">
    <div class="font-bold text-xl">🔥 Chatterbox</div>
    <input id="search" placeholder="Search squads..." class="bg-gray-900 border border-gray-700 rounded-full px-4 py-1.5 flex-1 max-w-md">
    <div id="current-user" class="ml-auto"></div>
  </div>

  <div class="flex flex-1 overflow-hidden">
    <!-- Sidebar -->
    <div class="w-80 border-r border-gray-800 bg-gray-950 flex flex-col">
      <div class="p-4 font-semibold border-b border-gray-800 flex justify-between">
        <span>Squads</span>
        <button onclick="showCreateGroup()" class="text-2xl text-purple-500">+</button>
      </div>
      <div id="group-list" class="flex-1 overflow-y-auto"></div>
    </div>

    <!-- Main Chat -->
    <div class="flex-1 flex flex-col">
      <div id="chat-header" class="h-14 border-b border-gray-800 px-4 flex items-center bg-gray-900">
        <div id="active-name" class="font-bold">Global Lounge</div>
      </div>
      <div id="messages" class="flex-1 p-6 overflow-y-auto space-y-4"></div>
      <div class="p-4 bg-gray-900 border-t border-gray-800">
        <input id="message-input" type="text" placeholder="Type a message..." 
               class="bg-gray-800 w-full rounded-full px-6 py-3">
        <button onclick="sendMessage()" class="mt-3 bg-purple-600 w-full py-3 rounded-full font-bold">SEND</button>
      </div>
    </div>
  </div>

  <!-- Username Modal -->
  <div id="username-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
    <div class="bg-gray-900 p-8 rounded-3xl w-96 text-center border border-purple-500">
      <h2 class="text-2xl font-bold mb-4">Choose Your Hero Name</h2>
      <input id="modal-username" type="text" placeholder="LiamTheAvenger" 
             class="bg-gray-800 w-full rounded-2xl px-5 py-4 text-center mb-4">
      <button onclick="submitUsername()" class="bg-purple-600 w-full py-4 rounded-2xl font-bold">ENTER CHATTERBOX</button>
    </div>
  </div>

  <script>
    const socket = io();
    let username = "";
    let currentRoom = 'global';

    function hideLoadingScreen() {
      const loading = document.getElementById('loading-screen');
      loading.style.opacity = '0';
      setTimeout(() => loading.style.display = 'none', 800);
    }

    socket.on('connect', () => {
      setTimeout(hideLoadingScreen, 600);
      document.getElementById('username-modal').classList.remove('hidden');
    });

    function submitUsername() {
      const name = document.getElementById('modal-username').value.trim();
      if (name) socket.emit('setUsername', name);
    }

    socket.on('usernameSet', (data) => {
      username = data.username;
      document.getElementById('username-modal').classList.add('hidden');
      document.getElementById('current-user').textContent = `👤 ${username}`;
      loadGroups(data.rooms || ['global']);
    });

    function loadGroups(roomsList) {
      const html = roomsList.map(r => `
        <div onclick="switchGroup('${r}')" class="p-4 hover:bg-gray-800 cursor-pointer border-b border-gray-800">
          ${r === 'global' ? '🌐 Global Lounge' : r}
        </div>
      `).join('');
      document.getElementById('group-list').innerHTML = html;
    }

    function switchGroup(room) {
      currentRoom = room;
      document.getElementById('active-name').textContent = room === 'global' ? 'Global Lounge' : room;
      document.getElementById('messages').innerHTML = '';
      socket.emit('joinGroup', room);
    }

    function showCreateGroup() {
      alert("Create group feature coming soon!");
    }

    function sendMessage() {
      const input = document.getElementById('message-input');
      if (input.value.trim()) {
        socket.emit('chatMessage', { message: input.value.trim(), room: currentRoom });
        input.value = '';
      }
    }

    socket.on('chatMessage', (data) => {
      if (data.room === currentRoom) {
        const div = document.createElement('div');
        div.className = `flex ${data.username === username ? 'justify-end' : 'justify-start'}`;
        div.innerHTML = `
          <div class="${data.username === username ? 'bg-purple-600' : 'bg-gray-800'} rounded-3xl px-5 py-3 max-w-[70%]">
            <small class="opacity-75">${data.username} • ${data.timestamp}</small>
            <p class="mt-1">${data.message}</p>
          </div>
        `;
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = 99999;
      }
    });
  </script>
</body>
</html>
